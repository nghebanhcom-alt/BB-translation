[project]
name = "bb-translation"
version = "1.2.0"
description = "Pipeline dich tai lieu nganh banh (EN -> VI), giu nguyen layout goc"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "anthropic>=0.34",
    "openai>=1.40",
    "google-generativeai>=0.8",
    "deepl>=1.18",
    "python-multipart>=0.0.9",
    "websockets>=13.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
